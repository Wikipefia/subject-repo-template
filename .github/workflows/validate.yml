name: Validate Content

# Runs on every push and pull request to catch content errors early.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate config & articles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Validate content
        run: pnpm validate

  structure-check:
    name: Check repository structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check config.json exists
        run: |
          if [ ! -f config.json ]; then
            echo "::error::config.json is missing"
            exit 1
          fi
          echo "✓ config.json exists"

      - name: Check config.json is valid JSON
        run: |
          if ! python3 -c "import json; json.load(open('config.json'))"; then
            echo "::error::config.json is not valid JSON"
            exit 1
          fi
          echo "✓ config.json is valid JSON"

      - name: Check required _front.mdx files
        run: |
          ERRORS=0
          for locale in en ru cz; do
            if [ -d "articles/$locale" ]; then
              if [ ! -f "articles/$locale/_front.mdx" ]; then
                echo "::error::articles/$locale/_front.mdx is missing (required for each locale directory)"
                ERRORS=$((ERRORS + 1))
              else
                echo "✓ articles/$locale/_front.mdx exists"
              fi
            fi
          done

          # At least one locale must have _front.mdx
          FRONT_COUNT=0
          for locale in en ru cz; do
            if [ -f "articles/$locale/_front.mdx" ]; then
              FRONT_COUNT=$((FRONT_COUNT + 1))
            fi
          done

          if [ "$FRONT_COUNT" -eq 0 ]; then
            echo "::error::No _front.mdx found in any locale. At least one locale must have _front.mdx"
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi

      - name: Check article filenames are valid slugs
        run: |
          ERRORS=0
          for file in $(find articles -name "*.mdx" -type f); do
            basename=$(basename "$file" .mdx)
            if [[ "$basename" != "_front" ]] && ! echo "$basename" | grep -qE '^[a-z0-9-]+$'; then
              echo "::error::Invalid article filename: $file (must match ^[a-z0-9-]+$ or be _front.mdx)"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "✓ All article filenames are valid slugs"

      - name: Check articles referenced in config exist
        run: |
          ERRORS=0
          # Extract article slugs from config.json categories
          ARTICLE_SLUGS=$(python3 -c "
          import json
          config = json.load(open('config.json'))
          for cat in config.get('categories', []):
              for article in cat.get('articles', []):
                  print(article)
          ")

          for slug in $ARTICLE_SLUGS; do
            FOUND=0
            for locale in en ru cz; do
              if [ -f "articles/$locale/$slug.mdx" ]; then
                FOUND=1
                break
              fi
            done
            if [ "$FOUND" -eq 0 ]; then
              echo "::error::Article '$slug' referenced in config.json categories but no MDX file found in any locale"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "✓ All articles referenced in config.json exist"

  frontmatter-check:
    name: Validate MDX frontmatter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontmatter structure
        run: |
          ERRORS=0
          for file in $(find articles -name "*.mdx" -type f); do
            # Check file starts with ---
            if ! head -1 "$file" | grep -q '^---$'; then
              echo "::error::$file is missing frontmatter (must start with ---)"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            # Check frontmatter has closing ---
            CLOSE_LINE=$(tail -n +2 "$file" | grep -n '^---$' | head -1 | cut -d: -f1)
            if [ -z "$CLOSE_LINE" ]; then
              echo "::error::$file has unclosed frontmatter (missing closing ---)"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            echo "✓ $file has valid frontmatter delimiters"
          done

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi

      - name: Check required frontmatter fields
        run: |
          pip install pyyaml > /dev/null 2>&1
          python3 << 'PYEOF'
          import yaml
          import os
          import sys

          errors = []

          for root, dirs, files in os.walk("articles"):
              for f in files:
                  if not f.endswith(".mdx"):
                      continue
                  filepath = os.path.join(root, f)
                  with open(filepath) as fh:
                      content = fh.read()

                  # Extract frontmatter
                  if not content.startswith("---"):
                      continue
                  parts = content.split("---", 2)
                  if len(parts) < 3:
                      continue

                  try:
                      fm = yaml.safe_load(parts[1])
                  except yaml.YAMLError as e:
                      errors.append(f"{filepath}: Invalid YAML frontmatter: {e}")
                      continue

                  if not isinstance(fm, dict):
                      errors.append(f"{filepath}: Frontmatter is not a mapping")
                      continue

                  # Check required fields
                  for field in ["title", "slug", "keywords", "created"]:
                      if field not in fm:
                          errors.append(f"{filepath}: Missing required field '{field}'")

                  # Check localized fields have all locales
                  for field in ["title", "keywords"]:
                      if field in fm and isinstance(fm[field], dict):
                          for locale in ["ru", "en", "cz"]:
                              if locale not in fm[field]:
                                  errors.append(f"{filepath}: Field '{field}' missing locale '{locale}'")

                  # Check slug matches filename
                  expected_slug = os.path.splitext(f)[0]
                  if "slug" in fm and fm["slug"] != expected_slug:
                      errors.append(
                          f"{filepath}: slug '{fm['slug']}' does not match filename '{expected_slug}'"
                      )

          if errors:
              for e in errors:
                  print(f"::error::{e}", file=sys.stderr)
              print(f"\n{len(errors)} error(s) found", file=sys.stderr)
              sys.exit(1)
          else:
              print("✓ All frontmatter fields are valid")
          PYEOF
